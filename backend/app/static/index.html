<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Подбор подрядчиков</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <h1>Подбор подрядчиков для мероприятия</h1>
  <p class="subtitle">Детерминированный движок рекомендаций с объяснением каждого выбора</p>
</header>

<main class="layout">
  <section class="panel search-panel">
    <h2>Параметры поиска</h2>
    <form id="search-form">
      <div class="field-row">
        <label for="city">Город *</label>
        <select id="city" name="city" required></select>
      </div>
      <div class="field-row">
        <label for="event_date">Дата мероприятия *</label>
        <input id="event_date" name="event_date" type="date" required />
      </div>
      <div class="field-row">
        <label for="event_format">Формат мероприятия *</label>
        <select id="event_format" name="event_format" required></select>
      </div>
      <div class="field-row">
        <label for="category">Категория подрядчика *</label>
        <select id="category" name="category" required></select>
      </div>
      <div class="field-row">
        <label for="budget_kzt">Бюджет, KZT *</label>
        <input id="budget_kzt" name="budget_kzt" type="number" min="1" required />
      </div>
      <div class="field-row">
        <label for="duration_hours">Длительность, часов</label>
        <input id="duration_hours" name="duration_hours" type="number" min="1" />
      </div>
      <div class="field-row">
        <label for="language">Язык</label>
        <select id="language" name="language">
          <option value="">— не важно —</option>
        </select>
      </div>
      <div class="field-row">
        <label for="preferences">Пожелания</label>
        <textarea id="preferences" name="preferences" rows="3" placeholder="Например: спокойная интеллигентная подача"></textarea>
      </div>
      <button type="submit" id="search-btn">Найти подрядчиков</button>
    </form>
    <p id="calendar-hint" class="hint"></p>
  </section>

  <section class="panel results-panel">
    <h2>Результаты</h2>
    <div id="results-status" class="status-box status-idle">
      Заполните форму и нажмите «Найти подрядчиков».
    </div>
    <div id="results-cards" class="cards"></div>
  </section>

  <section class="panel chat-panel">
    <h2>AI-помощник</h2>
    <div id="chat-messages" class="chat-messages"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Например: а теперь 17 октября" autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
